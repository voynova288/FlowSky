<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流空 Liukong</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #27324f, #090b13 55%); color: #eef2ff; }
      main { width: min(1180px, calc(100vw - 28px)); height: min(840px, calc(100vh - 28px)); margin: 14px auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; }
      .chat, aside { border: 1px solid rgba(255,255,255,.14); border-radius: 22px; background: rgba(8, 12, 24, .62); box-shadow: 0 24px 80px rgba(0,0,0,.35); overflow: hidden; }
      .chat { display: grid; grid-template-rows: auto 1fr auto; }
      header, aside header { padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
      h1 { margin: 0; font-size: 25px; letter-spacing: .03em; }
      h2 { margin: 0 0 10px; font-size: 15px; }
      .status, label, .meta { color: #a7b3d7; font-size: 12px; }
      #messages { overflow: auto; padding: 18px; }
      .msg { max-width: 78%; margin: 10px 0; padding: 12px 14px; border-radius: 16px; white-space: pre-wrap; line-height: 1.55; }
      .user { margin-left: auto; background: #4f46e5; }
      .ai { margin-right: auto; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.08); }
      form.chat-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px; border-top: 1px solid rgba(255,255,255,.1); }
      textarea, input, select { width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.28); color: #fff; padding: 10px 11px; font: inherit; outline: none; }
      textarea { resize: none; min-height: 56px; }
      button { border: 0; border-radius: 12px; padding: 10px 13px; background: #f0b6ff; color: #1c1024; font-weight: 700; cursor: pointer; }
      button.secondary { background: rgba(255,255,255,.13); color: #eef2ff; }
      button.danger { background: #ff9aa2; color: #2a0509; }
      button:disabled { opacity: .55; cursor: wait; }
      aside { overflow: auto; padding-bottom: 12px; }
      .panel { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin: 8px 0; }
      .row.stack { grid-template-columns: 1fr; }
      .memory, .session { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.08); margin: 9px 0; }
      .session.active { outline: 1px solid #f0b6ff; }
      .memory.pending { outline: 1px solid #f0b6ff; }
      .memory-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
      .avatar-state { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
      .avatar-face { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #f0b6ff, #8ea7ff); color: #1c1024; font-size: 28px; box-shadow: 0 14px 40px rgba(240,182,255,.24); }
      .state-line { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 13px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } .chat { min-height: 70vh; } }
    </style>
  </head>
  <body>
    <main>
      <section class="chat">
        <header>
          <h1>流空 Liukong</h1>
          <div class="status" id="status">本地优先 · BYOK · 无账号 · 本机 SQLite 记忆</div>
        </header>
        <section id="messages" aria-live="polite"></section>
        <form class="chat-form" id="chatForm">
          <textarea id="input" placeholder="说点什么，比如：今天有点累" required></textarea>
          <button id="send" type="submit">发送</button>
        </form>
      </section>
      <aside>
        <header><h2>本地控制台</h2><div class="meta">不需要账号。API key 只发给本机 localhost 后端，不写入数据库。</div></header>
        <section class="panel">
          <h2>模型密钥</h2>
          <div class="row"><label>模型 provider</label><select id="providerName"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option></select></div>
          <div class="row stack"><label>Provider API key（可选；当前浏览器会话保存，留空则使用后端 .env.local/环境变量）</label><input id="apiKey" type="password" placeholder="sk-..." /></div>
          <div class="row stack"><label>本地 profile</label><input id="profileId" value="default" /></div>
          <button class="secondary" id="saveClient" type="button">保存本地会话设置</button>
        </section>
        <section class="panel">
          <h2>会话</h2>
          <div class="row"><label>当前 session</label><input id="sessionId" value="local-session" /></div>
          <button id="newSession" type="button">新会话</button>
          <button class="secondary" id="refreshSessions" type="button">刷新</button>
          <div id="sessions"></div>
        </section>
        <section class="panel">
          <h2>用户设置</h2>
          <div class="row"><label>长期记忆</label><input id="memoryEnabled" type="checkbox" /></div>
          <div class="row"><label>恋爱真实感</label><select id="romanceLevel"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div>
          <div class="row"><label>Avatar</label><input id="avatarEnabled" type="checkbox" /></div>
          <div class="row"><label>本地语音</label><input id="voiceEnabled" type="checkbox" /></div>
          <button class="secondary" id="loadSettings" type="button">读取</button>
          <button id="saveSettings" type="button">保存</button>
        </section>
        <section class="panel" id="avatarStatePanel" aria-live="polite">
          <h2>Avatar / Voice</h2>
          <div class="avatar-state">
            <div class="avatar-face" id="avatarFace">🙂</div>
            <div>
              <div class="state-line"><span>情绪</span><strong id="avatarEmotion">neutral</strong></div>
              <div class="state-line"><span>动作</span><strong id="avatarAction">idle</strong></div>
              <div class="meta" id="voiceStatus">语音关闭</div>
            </div>
          </div>
        </section>
        <section class="panel">
          <h2>角色卡</h2>
          <div class="row stack"><label>default_girlfriend.json</label><textarea id="characterJson" rows="8" spellcheck="false"></textarea></div>
          <button class="secondary" id="loadCharacter" type="button">读取角色</button>
          <button id="saveCharacter" type="button">保存角色</button>
          <button class="secondary" id="resetCharacter" type="button">恢复默认</button>
        </section>
        <section class="panel">
          <h2>记忆</h2>
          <button class="secondary" id="refreshMemories" type="button">刷新记忆</button>
          <div id="memories"></div>
        </section>
        <section class="panel">
          <h2>本地数据</h2>
          <div class="row stack"><label>导入会替换当前 profile 的本地 SQLite 数据，不会导入 API key 或 local token</label><input id="importDataFile" type="file" accept="application/json" /></div>
          <button class="secondary" id="exportData" type="button">导出 JSON</button>
          <button id="importData" type="button">导入 JSON</button>
          <button class="danger" id="resetData" type="button">清空本地数据</button>
        </section>
      </aside>
    </main>
    <script>
      const boot = window.__LIUKONG_LOCAL__ || { localToken: '', profileId: 'default' };
      const $ = (id) => document.querySelector(id);
      const messages = $('#messages'), form = $('#chatForm'), input = $('#input'), send = $('#send'), statusEl = $('#status');
      const providerName = $('#providerName'), apiKey = $('#apiKey'), profileId = $('#profileId'), sessionId = $('#sessionId'), sessionsEl = $('#sessions'), memoryEnabled = $('#memoryEnabled'), romanceLevel = $('#romanceLevel'), avatarEnabled = $('#avatarEnabled'), voiceEnabled = $('#voiceEnabled'), avatarFace = $('#avatarFace'), avatarEmotion = $('#avatarEmotion'), avatarAction = $('#avatarAction'), voiceStatus = $('#voiceStatus'), characterJson = $('#characterJson'), memoriesEl = $('#memories'), importDataFile = $('#importDataFile');
      providerName.value = localStorage.getItem('liukong.provider_name') || 'deepseek';
      apiKey.value = sessionStorage.getItem(providerApiKeyStorageKey()) || '';
      function selectedProvider() { return providerName.value === 'openai' ? 'openai' : 'deepseek'; }
      function providerApiKeyStorageKey() { return selectedProvider() === 'openai' ? 'liukong.openai_api_key' : 'liukong.deepseek_api_key'; }
      profileId.value = localStorage.getItem('liukong.profile_id') || boot.profileId || 'default';
      sessionId.value = localStorage.getItem('liukong.session_id') || 'local-session';

      function headers(json = false, includeApiKey = false) {
        const h = json ? { 'content-type': 'application/json' } : {};
        h['x-liukong-local-token'] = boot.localToken || '';
        h['x-liukong-profile-id'] = profileId.value.trim() || 'default';
        h['x-liukong-provider'] = selectedProvider();
        if (includeApiKey && apiKey.value.trim()) h['x-liukong-api-key'] = apiKey.value.trim();
        return h;
      }
      function profileQuery() { return '?profile_id=' + encodeURIComponent(profileId.value.trim() || 'default'); }
      function append(role, text = '') { const box = document.createElement('div'); box.className = `msg ${role}`; box.textContent = text; messages.appendChild(box); messages.scrollTop = messages.scrollHeight; return box; }
      function parseSse(buffer, onEvent) { const parts = buffer.split('\n\n'); const rest = parts.pop() || ''; for (const part of parts) { const event = part.split('\n').find(l => l.startsWith('event:'))?.slice(6).trim(); const data = part.split('\n').find(l => l.startsWith('data:'))?.slice(5).trim(); if (event && data) onEvent(event, JSON.parse(data)); } return rest; }
      function loadVoiceSetting() { voiceEnabled.checked = localStorage.getItem('liukong.voice_enabled') === 'true'; updateVoiceStatus(); }
      function saveVoiceSetting() { localStorage.setItem('liukong.voice_enabled', voiceEnabled.checked ? 'true' : 'false'); updateVoiceStatus(); }
      function updateVoiceStatus(extra = '') { voiceStatus.textContent = voiceEnabled.checked ? ('语音开启' + (extra ? ' · ' + extra : '')) : '语音关闭'; }
      function cancelSpeech() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
      function speakFinalAssistantText(text) { const finalText = String(text || '').trim(); if (!voiceEnabled.checked || !finalText) return; if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { updateVoiceStatus('当前浏览器不支持'); return; } cancelSpeech(); const utterance = new SpeechSynthesisUtterance(finalText); utterance.lang = document.documentElement.lang || 'zh-CN'; utterance.onend = () => updateVoiceStatus('已读完'); utterance.onerror = () => updateVoiceStatus('朗读失败'); updateVoiceStatus('朗读中'); window.speechSynthesis.speak(utterance); }
      function updateAvatarState(data) { const emotion = String(data?.emotion || 'neutral'); const action = String(data?.action || 'idle'); avatarEmotion.textContent = emotion; avatarAction.textContent = action; avatarFace.textContent = ({ gentle: '🙂', caring: '🤍', playful: '😉', concerned: '🫧', neutral: '🙂' }[emotion] || '🙂'); if (avatarEnabled.checked) statusEl.textContent = `emotion=${emotion}, action=${action}`; }


      $('#saveClient').onclick = () => { localStorage.setItem('liukong.provider_name', selectedProvider()); localStorage.setItem('liukong.profile_id', profileId.value.trim() || 'default'); localStorage.setItem('liukong.session_id', sessionId.value.trim() || 'local-session'); sessionStorage.setItem(providerApiKeyStorageKey(), apiKey.value.trim()); saveVoiceSetting(); statusEl.textContent = '本地会话设置已保存；provider 选择保存在 localStorage，API key 仅保存到 sessionStorage'; };
      $('#loadSettings').onclick = () => loadSettings().catch(showError);
      $('#saveSettings').onclick = () => saveSettings().catch(showError);
      voiceEnabled.onchange = () => { saveVoiceSetting(); if (!voiceEnabled.checked) cancelSpeech(); };
      providerName.onchange = () => { localStorage.setItem('liukong.provider_name', selectedProvider()); apiKey.value = sessionStorage.getItem(providerApiKeyStorageKey()) || ''; statusEl.textContent = `已切换 provider：${selectedProvider()}；留空 key 将使用后端环境变量`; };
      $('#newSession').onclick = () => newSession().catch(showError);
      $('#refreshSessions').onclick = () => loadSessions().catch(showError);
      $('#refreshMemories').onclick = () => loadMemories().catch(showError);
      $('#loadCharacter').onclick = () => loadCharacter().catch(showError);
      $('#saveCharacter').onclick = () => saveCharacter().catch(showError);
      $('#resetCharacter').onclick = () => resetCharacter().catch(showError);
      $('#exportData').onclick = () => exportData().catch(showError);
      $('#importData').onclick = () => importData().catch(showError);
      $('#resetData').onclick = () => resetData().catch(showError);

      async function newSession() {
        const res = await fetch('/sessions' + profileQuery(), { method: 'POST', headers: headers(true), body: JSON.stringify({ title: '新会话' }) });
        if (!res.ok) throw new Error('session create failed: ' + res.status);
        const body = await res.json();
        setSession(body.session.id);
        messages.innerHTML = '';
        await loadSessions();
      }
      async function loadSessions() {
        const res = await fetch('/sessions' + profileQuery(), { headers: headers() });
        if (!res.ok) return;
        const body = await res.json();
        sessionsEl.innerHTML = '';
        for (const s of body.sessions || []) renderSession(s);
      }
      async function loadSessionMessages(id) {
        const res = await fetch(`/sessions/${encodeURIComponent(id)}/messages` + profileQuery(), { headers: headers() });
        if (!res.ok) throw new Error('messages load failed: ' + res.status);
        const body = await res.json();
        messages.innerHTML = '';
        for (const m of body.messages || []) append(m.role === 'user' ? 'user' : 'ai', m.content || '');
      }
      function renderSession(s) {
        const div = document.createElement('div'); div.className = 'session' + (s.id === sessionId.value ? ' active' : '');
        const title = document.createElement('div'); title.textContent = s.title || s.last_message_preview || s.id;
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${s.message_count || 0} 条 · ${s.updated_at || ''}`;
        const actions = document.createElement('div'); actions.className = 'memory-actions';
        actions.append(button('打开', async () => { setSession(s.id); await loadSessionMessages(s.id); await loadSessions(); }));
        actions.append(button('改名', async () => { const next = prompt('会话标题', s.title || ''); if (next === null) return; await renameSession(s.id, next); }));
        actions.append(button('删除', async () => { if (!confirm('删除这个会话？')) return; await deleteSession(s.id); }, 'danger'));
        div.append(title, meta, actions); sessionsEl.append(div);
      }
      function setSession(id) { sessionId.value = id; localStorage.setItem('liukong.session_id', id); }
      async function renameSession(id, title) { await fetch(`/sessions/${encodeURIComponent(id)}` + profileQuery(), { method: 'PATCH', headers: headers(true), body: JSON.stringify({ title }) }); await loadSessions(); }
      async function deleteSession(id) { await fetch(`/sessions/${encodeURIComponent(id)}` + profileQuery(), { method: 'DELETE', headers: headers() }); if (id === sessionId.value) { messages.innerHTML = ''; setSession('local-session'); } await loadSessions(); }

      async function loadSettings() {
        const res = await fetch('/settings' + profileQuery(), { headers: headers() });
        if (!res.ok) throw new Error('settings load failed: ' + res.status);
        const s = await res.json();
        memoryEnabled.checked = !!s.memory_enabled;
        romanceLevel.value = String(s.romance_realism_level ?? 1);
        avatarEnabled.checked = !!s.avatar_enabled;
        if (typeof s.voice_enabled === 'boolean') voiceEnabled.checked = !!s.voice_enabled;
        else loadVoiceSetting();
        saveVoiceSetting();
      }
      async function saveSettings() {
        await fetch('/settings' + profileQuery(), { method: 'PATCH', headers: headers(true), body: JSON.stringify({ memory_enabled: memoryEnabled.checked, romance_realism_level: Number(romanceLevel.value), avatar_enabled: avatarEnabled.checked, voice_enabled: voiceEnabled.checked }) });
        saveVoiceSetting();
        statusEl.textContent = '设置已保存到本机';
      }
      async function loadMemories() {
        const res = await fetch('/memories' + profileQuery(), { headers: headers() });
        const body = await res.json();
        memoriesEl.innerHTML = '';
        for (const m of body.memories || []) renderMemory(m);
      }
      async function loadCharacter() {
        const res = await fetch('/character' + profileQuery(), { headers: headers() });
        if (!res.ok) throw new Error('character load failed: ' + res.status);
        const body = await res.json();
        characterJson.value = JSON.stringify(body.character, null, 2);
      }
      async function saveCharacter() {
        const character = JSON.parse(characterJson.value);
        const res = await fetch('/character' + profileQuery(), { method: 'PATCH', headers: headers(true), body: JSON.stringify({ character }) });
        if (!res.ok) throw new Error('character save failed: ' + res.status);
        const body = await res.json();
        characterJson.value = JSON.stringify(body.character, null, 2);
        statusEl.textContent = '角色卡已保存到本机';
      }
      async function resetCharacter() {
        const res = await fetch('/character/reset' + profileQuery(), { method: 'POST', headers: headers(true), body: '{}' });
        const body = await res.json();
        characterJson.value = JSON.stringify(body.character, null, 2);
        statusEl.textContent = '角色卡已恢复默认';
      }
      function renderMemory(m) {
        const div = document.createElement('div');
        const pending = !m.user_confirmed || m.needs_user_confirmation || !m.should_store;
        div.className = 'memory' + (pending ? ' pending' : '');
        const content = document.createElement('div'); content.textContent = String(m.content || '');
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${String(m.memory_type || 'memory')} · ${String(m.sensitivity || 'low')}${pending ? ' · 待确认' : ''}`;
        const actions = document.createElement('div'); actions.className = 'memory-actions';
        if (pending) actions.append(button('确认', () => confirmMemory(m.id)), button('拒绝', () => rejectMemory(m.id)));
        actions.append(button('删除', () => rejectMemory(m.id), 'danger'));
        div.append(content, meta, actions); memoriesEl.append(div);
      }
      function button(text, onclick, cls = 'secondary') { const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text; b.onclick = onclick; return b; }
      async function confirmMemory(id) { await fetch(`/memories/${encodeURIComponent(id)}/confirm` + profileQuery(), { method: 'POST', headers: headers(true), body: '{}' }); await loadMemories(); }
      async function rejectMemory(id) { await fetch(`/memories/${encodeURIComponent(id)}/reject` + profileQuery(), { method: 'POST', headers: headers(true), body: '{}' }); await loadMemories(); }
      async function exportData() { const res = await fetch('/local/export' + profileQuery(), { headers: headers() }); const data = await res.json(); const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `liukong-${profileId.value || 'default'}-export.json`; a.click(); URL.revokeObjectURL(a.href); }
      async function importData() { const file = importDataFile.files && importDataFile.files[0]; if (!file) throw new Error('请选择要导入的 Liukong JSON 文件'); if (!confirm('导入会替换当前 profile 的本地设置、记忆、会话和工具记录。继续吗？')) return; const data = JSON.parse(await file.text()); const res = await fetch('/local/import' + profileQuery(), { method: 'POST', headers: headers(true), body: JSON.stringify(data) }); if (!res.ok) throw new Error('import failed: ' + res.status); const body = await res.json(); messages.innerHTML = ''; await loadSettings(); await loadMemories(); await loadSessions(); statusEl.textContent = `导入完成：${body.counts?.sessions || 0} 个会话，${body.counts?.messages || 0} 条消息`; }
      async function resetData() { if (!confirm('确定清空当前 profile 的本地设置、记忆和日志吗？')) return; await fetch('/local/reset' + profileQuery(), { method: 'POST', headers: headers(true), body: '{}' }); messages.innerHTML = ''; await loadSettings(); await loadMemories(); await loadSessions(); statusEl.textContent = '本地数据已清空'; }
      function showError(error) { statusEl.textContent = '错误：' + error.message; }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim(); if (!text) return;
        cancelSpeech(); input.value = ''; send.disabled = true; append('user', text); const aiBox = append('ai', ''); statusEl.textContent = 'Mika 正在回复…';
        try {
          const res = await fetch('/chat/stream', { method: 'POST', headers: headers(true, true), body: JSON.stringify({ profile_id: profileId.value.trim() || 'default', session_id: sessionId.value.trim() || 'local-session', input: { type: 'text', text }, mode: 'girlfriend_chat', client_context: { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, avatar_enabled: avatarEnabled.checked, voice_enabled: voiceEnabled.checked } }) });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const reader = res.body.getReader(), decoder = new TextDecoder(); let buffer = '';
          while (true) { const { done, value } = await reader.read(); if (done) break; buffer += decoder.decode(value, { stream: true }); buffer = parseSse(buffer, (name, data) => { if (name === 'text_delta') aiBox.textContent += data.delta; if (name === 'avatar_signal') updateAvatarState(data); if (name === 'memory_candidate') statusEl.textContent = '已生成记忆候选'; messages.scrollTop = messages.scrollHeight; }); }
          speakFinalAssistantText(aiBox.textContent); statusEl.textContent = '就绪'; await loadMemories(); await loadSessions();
        } catch (error) { aiBox.textContent = '连接失败：' + error.message; statusEl.textContent = '错误'; }
        finally { send.disabled = false; input.focus(); }
      });
      loadVoiceSetting(); loadSettings().catch(() => {}); loadMemories().catch(() => {}); loadCharacter().catch(() => {}); loadSessions().catch(() => {});
    </script>
  </body>
</html>
